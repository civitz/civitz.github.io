<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>{{ if and .Title (not .IsHome) }}{{ .Title }}{{ else }}{{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if and .IsPage (eq .Section "posts") }}{{ .Summary | plainify | replaceRE "\n" "" | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}">

  {{- $style := resources.Get "css/style.scss" | resources.ToCSS (dict "targetPath" "css/style.css") }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  <link rel="canonical" href="{{ partial "clean-url.html" .Permalink }}">
  {{- with site.Home.OutputFormats.Get "rss" }}
  <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
  {{- end }}
</head>
