<footer class="site-footer">
  <div class="wrapper">
    &copy; {{ now.Year }} {{ site.Title }}
    {{- with site.Params.github_username }}
    <span class="sep">&middot;</span><a rel="me" href="https://github.com/{{ . }}">GitHub</a>
    {{- end }}
    {{- with site.Params.mastodon_url }}
    <span class="sep">&middot;</span><a rel="me" href="{{ . }}">Mastodon</a>
    {{- end }}
    {{- with site.Home.OutputFormats.Get "rss" }}
    <span class="sep">&middot;</span><a href="{{ .RelPermalink }}">RSS</a>
    {{- end }}
  </div>
</footer>
