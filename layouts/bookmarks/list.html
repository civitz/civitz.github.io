{{ define "main" }}
<ul class="post-list">
  {{- range .Pages.ByDate.Reverse }}
  <li>
    <a class="post-link" href="{{ .Params.link }}">{{ with .Params.short }}{{ . }}{{ else }}{{ .Params.link | truncate 40 }}{{ end }}</a>
    {{- with .Plain | htmlUnescape }}
    <p class="post-excerpt">{{ . }}</p>
    {{- end }}
  </li>
  {{- end }}
</ul>
{{ end }}
