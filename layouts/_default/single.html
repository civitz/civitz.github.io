{{ define "main" }}
<article class="page {{ .File.ContentBaseName }}">

  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{- with .Params.tagline }}
    <p class="page-tagline">{{ . }}</p>
    {{- end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

</article>
{{ end }}
