{{ define "main" }}
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 itemprop="name headline">{{ .Title }}</h1>
    <time class="post-date" datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}" itemprop="datePublished">{{ .Date.Format "Jan 2, 2006" }}</time>
    {{- with .Params.author }}
    <span class="post-date" itemprop="author">by {{ . }}</span>
    {{- end }}
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ .Content }}
  </div>

</article>
{{ end }}
