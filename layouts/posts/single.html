{{ define "main" }}
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline"><a class="post-title-link"  href="{{ partial "clean-url.html" .RelPermalink }}">{{ .Title }}</a></h1>
  <center>  <p class="post-meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}" itemprop="datePublished">{{ .Date.Format "Jan 2, 2006" }}</time></p>
    {{- with .Params.author }}
     <div class="">
       <center><p ><strong><span class="authorKeyword">Author</span><span class="small-site-title"> <h2 style="letter-spacing: 3px !important;
       text-transform: uppercase !important;">{{ . }}</h2></span></strong></p></center>

     </div>
    {{- end }}
   </center>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ .Content }}
  </div>


</article>
{{ end }}
